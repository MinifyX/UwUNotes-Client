[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri", "apps/setup/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/MinifyX/UwUNotes-Client"
rust-version = "1.82"

[workspace.dependencies]
uwunotes-fs = { path = "crates/uwunotes-fs" }
uwunotes-session = { path = "crates/uwunotes-session" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

# Encoding is the whole reason this app has a Rust side worth having:
# encoding_rs does the actual decode/encode for every legacy code page,
# chardetng guesses which one a file without a BOM is in.
chardetng = "0.1"
encoding_rs = "0.8"

# Walking a project tree for "find in files": ignore respects .gitignore, so a
# search never disappears into node_modules; grep-searcher does the line
# matching without loading a whole file into memory.
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"

# The setup (apps/setup/src-tauri). It carries the editor inside itself, packed
# with zstd — the macOS app bundle as a tar archive first (tar) — and writes
# the things an installation is made of: on Windows the registry entry under
# "Installed apps" (winreg), the Start-menu shortcut and the known folders it
# all goes into (windows); everywhere a version comparison that stops an
# update from going backwards (semver). Its tests install into a folder of
# their own (tempfile).
semver = "1"
tar = "0.4"
tempfile = "3"
winreg = "0.55"
zstd = "0.13"

# Spelled out as a table of its own because of the feature list: the `windows`
# crate compiles what is named here and nothing else.
[workspace.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Com_Urlmon",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
