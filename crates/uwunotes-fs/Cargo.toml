[package]
name = "uwunotes-fs"
description = "Reading, writing, listing and searching files for UwUNotes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
chardetng.workspace = true
encoding_rs.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Three questions the standard library will not answer: whether a handle is a
# real file on a disk or a named pipe, how many names a file has, and how to
# replace a file without giving it the folder's access list. Same version the
# desktop crate already pulls in, so this adds nothing to the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

# The integration tests build reference byte sequences by hand, which means they
# need the same encoder the crate uses.
[dev-dependencies]
encoding_rs.workspace = true
