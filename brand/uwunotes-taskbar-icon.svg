    Taskbar, window and Linux menus: Nyu alone, upright, no tile. A sheet with
    a folded corner and three ruled plum lines, the last one short with the
    caret at its end, so it reads as notes; the ears say Nyu. The white
    die-cut edge keeps it visible on dark and light taskbars.
  -->
