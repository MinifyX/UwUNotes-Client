<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UwUNotes app icon: Nyu as a sheet of paper with cat ears, on a butter-yellow tile">
  <title>UwUNotes</title>
  <!--
    Built like UwUMail's, UwUSSH's and UwURDP's: Nyu slightly tilted on a
    pastel tile with two sparkles and a heart. Butter yellow, like a notepad,
    tells it apart from pink, lavender and sky blue. The sheet with its
    folded corner is the face: UwU eyes, a round w, two ruled lines and the
    caret below. Platform icons: node scripts/icons.mjs
  -->
