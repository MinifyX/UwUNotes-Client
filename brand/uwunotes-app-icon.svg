<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UwUNotes app icon: Nyu as a spiral notebook with cat ears and a pencil behind her ear">
  <title>UwUNotes</title>
  <!--
    The website, GitHub and platform icon, built like UwUMail's: Nyu slightly
    tilted on UwUMail's pastel pink tile (#FFF3F8 to #FFD3E5, the same for every
    UwU app), with sparkles and a heart arranged differently for each app.
    Nyu is a spiral notebook (rings left, elastic band right, two ruled lines)
    with a pencil tucked behind her right ear. Here: a small star top left, the
    heart bottom right, a big star bottom left. Platform icons: node scripts/icons.mjs
  -->
  <defs>
    <linearGradient id="uwu-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3F8"/><stop offset="1" stop-color="#FFD3E5"/></linearGradient>
    <filter id="uwu-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#C2306F" flood-opacity="0.25"/></filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#uwu-bg)"/>
  <g transform="translate(256 290) rotate(-8) scale(0.9) translate(-256 -265)" stroke-linecap="round" stroke-linejoin="round">
    <g filter="url(#uwu-shadow)"><g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"><path d="M118 200 L132 100 Q135 82 151 91 L230 156 Z"/><path d="M394 200 L380 100 Q377 82 361 91 L282 156 Z"/><rect x="100" y="152" width="312" height="230" rx="40"/><g transform="translate(372 128) rotate(-38)"><rect x="-120" y="-20" width="240" height="40" rx="8"/></g></g></g>
    <g transform="translate(372 128) rotate(-38)" stroke="#4B1D3F" stroke-width="11" stroke-linejoin="round">
      <path d="M-120 -20 L-160 0 L-120 20 Z" fill="#F6D2A8"/>
      <path d="M-160 0 L-145 -7.5 L-145 7.5 Z" fill="#4B1D3F"/>
      <rect x="-120" y="-20" width="190" height="40" fill="#FFD66E"/>
      <rect x="70" y="-20" width="24" height="40" fill="#D9C4D0"/>
      <rect x="94" y="-20" width="30" height="40" rx="10" fill="#FF6FA6"/>
    </g><g fill="#FF6FA6" stroke="#4B1D3F" stroke-width="14"><path d="M118 200 L132 100 Q135 82 151 91 L230 156 Z"/><path d="M394 200 L380 100 Q377 82 361 91 L282 156 Z"/></g><g fill="#FFB8D3"><path d="M146 150 L151 116 Q152 108 159 112 L196 144 Z"/><path d="M366 150 L361 116 Q360 108 353 112 L316 144 Z"/></g><rect x="100" y="152" width="312" height="230" rx="40" fill="#FFB8D3"/>
    <rect x="360" y="152" width="20" height="230" fill="#FF6FA6"/>
    <rect x="100" y="152" width="312" height="230" rx="40" fill="none" stroke="#4B1D3F" stroke-width="14"/><g fill="none" stroke="#FF6FA6" stroke-width="12" stroke-linecap="round"><path d="M164 306 H320"/><path d="M164 342 H270"/></g><g fill="none" stroke="#4B1D3F" stroke-width="11" stroke-linecap="round"><path d="M128 182 H96 A14 14 0 0 0 96 210 H128"/><path d="M128 224 H96 A14 14 0 0 0 96 252 H128"/><path d="M128 266 H96 A14 14 0 0 0 96 294 H128"/><path d="M128 308 H96 A14 14 0 0 0 96 336 H128"/></g><g transform="translate(262 208) scale(1.15) translate(-256 -216)"><g fill="#FF7FB0"><ellipse cx="194" cy="238" rx="15" ry="8.5"/><ellipse cx="318" cy="238" rx="15" ry="8.5"/></g>
      <g fill="none" stroke="#4B1D3F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
