name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      # Creating the release is the only thing here that writes anything.
      contents: write
    steps:
      # Every `uses:` here is pinned to a commit rather than to a tag or a
      # branch, with the version in the comment. This job is the only thing in
      # the repository that produces the installer people download and the only
      # one holding a token that can write, so an action whose content is
      # "whatever that branch says today" is the one unpinned input left: both
      # lockfiles are committed and the install is `--frozen-lockfile`. The
      # repository refuses an unpinned action outright now; the reason above is
      # older than the rule.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Otherwise checkout leaves the job's write-capable token in
          # `.git/config`, where every `build.rs` in the dependency graph and
          # every install script can read it — for the rest of the build, to no
          # purpose, since nothing after this line uses git and the release
          # action takes its token from the environment.
          persist-credentials: false

      # Before anything is compiled: an installer that reports a different
      # version than the tag it came from is a support problem forever, and a
      # missing release note would only be noticed after the twelve-minute
      # build.
      - name: Check the tag and read the release notes
        id: release
        shell: pwsh
        env:
          # Through the environment rather than ${{ }} inside the script: a tag
          # name is arbitrary text and has no business being pasted into source.
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          # Both apps, because the setup is what says a version out loud — in
          # its window, in "Installed apps" and in the file name it is published
          # under. `pnpm build:setup` refuses to build them apart; this is the
          # same check at minute zero instead of minute three.
          foreach ($app in 'desktop', 'setup') {
            $file = "apps/$app/src-tauri/tauri.conf.json"
            if (-not (Test-Path $file)) {
              Write-Output "::error::$file is missing, and the release is built from it."
              exit 1
            }
            $configured = (Get-Content $file -Raw | ConvertFrom-Json).version
            if ($version -ne $configured) {
              Write-Output "::error::Tag $env:TAG means version $version, but $file says $configured. Fix one of them and tag again."
              exit 1
            }
          }

          $notes = "release-notes/$version.json"
          if (-not (Test-Path $notes)) {
            Write-Output "::error::$notes is missing. See release-notes/README.md."
            exit 1
          }
          $english = (Get-Content $notes -Raw -Encoding utf8 | ConvertFrom-Json).en
          if ([string]::IsNullOrWhiteSpace($english)) {
            Write-Output "::error::$notes has no 'en' text, and that is what the release page shows."
            exit 1
          }

          # As a file, so newlines and umlauts survive the trip into the action.
          $body = Join-Path $env:RUNNER_TEMP 'release-body.md'
          Set-Content -Path $body -Value $english -Encoding utf8
          "body=$body" >> $env:GITHUB_OUTPUT

          # A version with a suffix — v0.1.0-beta.1 — is not the finished thing.
          $prerelease = if ($env:TAG.Contains('-')) { 'true' } else { 'false' }
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Output "UwUNotes $version, pre-release: $prerelease"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `tauri build` runs this again through beforeBuildCommand. Doing it here
      # anyway means a TypeScript error fails as its own step after a minute,
      # rather than somewhere inside the bundler's output.
      - run: pnpm build

      # `stable` is a branch of that repository, not a tag, so the pin is a
      # commit and the toolchain is named here instead of being read off the
      # branch the pin no longer follows.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # UwUNotes-Setup-<version>.exe in target/release: the editor built with
      # --no-bundle and packed into UwUNotes' own installer, which is the file
      # people download and the file an installed copy runs to update itself.
      # The Cargo workspace is the repository root, so that is the root's
      # target, not one next to src-tauri.
      #
      # The signing key reaches this step and no other, because this is the one
      # that needs it: `pnpm build:setup` signs the finished setup and writes a
      # .sig next to it. Inside the script the key is taken back out of the
      # environment before any build starts, so none of the build scripts in the
      # dependency graph ever see it. It arrives through `env:` and is never
      # named in a `run:` line — a secret interpolated into a command is a
      # secret in the log of the first job that fails in an interesting way.
      - name: Build the setup
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build:setup

      # A release without a signature is a release nobody can update to, and an
      # unset secret looks from here exactly like a build that simply did not
      # sign: a folder with no .sig in it. Worth twelve minutes of runner time
      # to learn now rather than from a user in three weeks.
      - name: Check the setup was signed
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem target/release/UwUNotes-Setup-*.exe.sig -ErrorAction SilentlyContinue)
          if ($signed.Count -ne 1) {
            Write-Output "::error::Expected one signed setup, found $($signed.Count) .sig files. Check the TAURI_SIGNING_PRIVATE_KEY secrets and scripts/build-setup.mjs."
            exit 1
          }
          Write-Output "Signed: $($signed[0].Name)"

      # A second asset, for people who would rather have an MSI — one that a
      # policy can deploy, or that goes on a machine where the per-user install
      # is not what is wanted. It costs one bundle step and no compile: the
      # build above left target/release warm, so this is WiX and little else.
      #
      # No secrets here, and none needed. `createUpdaterArtifacts` is turned off
      # for this build alone, because the artifact updates go through is the
      # signed setup above and nothing reads a signature of the MSI. Left on,
      # `tauri build` would find the public key in tauri.conf.json, expect to
      # sign, and refuse to bundle without the private half — which is the whole
      # point of it not being here.
      - name: Build the MSI
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'msi.json'
          Set-Content -Path $config -Encoding utf8 -Value '{ "bundle": { "createUpdaterArtifacts": false } }'
          pnpm tauri build --bundles msi --config $config

      # The signature above is for the updater. Windows still sees a program
      # nobody vouched for, so for a person downloading the installer by hand a
      # checksum stays the only thing to check it against. It proves nothing on
      # its own — it is published by the same job — but it makes a file that was
      # swapped afterwards, on a mirror or in a forwarded message, noticeable.
      # Everything the release attaches is listed, the .sig included, so the
      # file matches the release page rather than a subset of it.
      - name: Write the checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem `
            target/release/UwUNotes-Setup-*.exe, `
            target/release/UwUNotes-Setup-*.exe.sig, `
            target/release/bundle/msi/*.msi
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          # LF, written by hand. `Set-Content` ends every line with CRLF on
          # Windows, and `sha256sum -c` — the tool this file exists for, and the
          # one people on Linux and macOS actually have — reads the carriage
          # return as part of the file name and reports that the file is
          # missing. v0.2.0 shipped a checksum file that could not be checked
          # that way.
          $text = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", $text, [System.Text.UTF8Encoding]::new($false))
          Get-Content SHA256SUMS.txt

      # softprops rather than `gh release create`: the body comes from a file,
      # the installers are globbed, the pre-release flag is an input, and an
      # installer that failed to appear fails the job. With the CLI all four
      # would be PowerShell plumbing, and PowerShell quoting is exactly the part
      # that cannot be tested before the tag is pushed.
      #
      # The .sig goes up with the setup it belongs to. The feed carries the same
      # signature, but a file next to the download is what lets a person check
      # it by hand against the public key in tauri.conf.json.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ steps.release.outputs.body }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            target/release/UwUNotes-Setup-*.exe
            target/release/UwUNotes-Setup-*.exe.sig
            target/release/bundle/msi/*.msi
            SHA256SUMS.txt

      # Only now, with the release online and everything attached to it. The
      # feed is what every installed copy asks; one that names a file which is
      # not there yet is not a delay, it is a failed update on someone's
      # machine, retried until the next release.
      - name: Build the update feed
        if: steps.release.outputs.prerelease == 'false'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          # The repository is public, so this buys nothing but a rate limit of
          # this job's own: unauthenticated, the runner shares one per address.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-feed.mjs $env:TAG --out "$env:RUNNER_TEMP/latest.json" --verify-release

      - name: Publish the update feed
        if: steps.release.outputs.prerelease == 'false'
        shell: pwsh
        env:
          # checkout ran with persist-credentials: false, so no step in this job
          # inherited a token that can write anything — it has to be handed over
          # on purpose, and this is the step that gets one. That is the point of
          # the flag. It stays inside a variable: the script below is printed to
          # the log exactly as it is written here, unexpanded.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # git declines to commit for nobody.
          GIT_AUTHOR_NAME: UwUNotes Release
          GIT_AUTHOR_EMAIL: release@uwunotes.invalid
          GIT_COMMITTER_NAME: UwUNotes Release
          GIT_COMMITTER_EMAIL: release@uwunotes.invalid
        run: |
          # A failing native command does not stop a pwsh step on its own, and
          # half of this sequence looks exactly like a published feed.
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = Join-Path $env:RUNNER_TEMP 'update-feed'
          $remote = "https://x-access-token:$($env:GITHUB_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git"

          # `updates` carries the feed and nothing else, so it is an orphan
          # branch: the first release starts it from an empty repository
          # instead of from main's history.
          if (git ls-remote --heads $remote updates) {
            git clone -q --depth 1 --branch updates $remote $dir
          } else {
            Write-Output 'The updates branch does not exist yet; this release starts it.'
            git init -q -b updates $dir
            Set-Content -Path (Join-Path $dir 'README.md') -Encoding utf8 -Value @(
              '# Update feed',
              '',
              'Written by .github/workflows/release.yml at the end of every finished release.',
              'Installed UwUNotes copies read `latest.json` from here; nothing else lives on',
              'this branch.'
            )
          }

          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'latest.json') -Destination $dir -Force
          git -C $dir add --all
          git -C $dir commit -qm "UwUNotes $env:TAG"
          git -C $dir push -q $remote HEAD:updates
          Write-Output "Feed: https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/updates/latest.json"

      # A pre-release is something people went looking for. The feed is what
      # everyone else follows, so it stays on the last finished version — and
      # says so, because a skipped step with no reason is a thing to look up.
      - name: Say why a pre-release gets no feed
        if: steps.release.outputs.prerelease == 'true'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: Write-Output "::notice::$env:TAG is a pre-release, so latest.json keeps pointing at the last finished version."
