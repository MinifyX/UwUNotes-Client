name: Release

# A tag builds, signs and publishes. A manual run (Actions → Release → Run
# workflow, from any branch) builds and signs the same way and stops there, so
# the builds can be tried before anything is tagged: the artifacts are on the
# run's page, and the `publish` and `aur` jobs are skipped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

# The shape of it, and why:
#
#   check ──┬─ windows ×2 (x64, ARM64) ─┐
#           ├─ macos (universal) ───────├─ sign ── publish ── aur (tags only)
#           └─ linux ×2 (x64, arm64) ───┘
#
# What a release attaches, and under which names, is scripts/release-files.mjs:
# stable names without a version (UwUNotes-windows-x64-setup.exe, …) so a link
# to `releases/latest/download/<name>` never goes stale, while the update
# signatures are made under the versioned names installed copies expect.
#
# The builds run `pnpm install` and compile a few hundred crates, and every
# `build.rs` and npm install script among them runs with whatever that job has.
# So none of them has anything worth taking: read-only token, no secrets. They
# hand their unsigned files on as artifacts.
#
# `sign` is the only job that ever sees the update-signing key. It installs one
# package, Tauri's CLI, with its install scripts switched off, into a folder of
# its own on a runner that has built nothing — no workspace, no node_modules, no
# Cargo — and signs the files it was handed.
#
# `publish` is the only job with a token that can write, and it does not build
# or install anything either: it attaches what the others made and writes the
# feed. `aur` holds the AUR's SSH key and nothing else, and only pushes two text
# files there.
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      version: ${{ steps.check.outputs.version }}
    steps:
      # Every `uses:` here is pinned to a commit rather than to a tag or a
      # branch, with the version in the comment. This workflow produces the
      # installers people download, and one job in it holds a token that can
      # write, so an action whose content is "whatever that branch says today"
      # is the one unpinned input left: both lockfiles are committed and the
      # install is `--frozen-lockfile`. The repository refuses an unpinned
      # action outright now; the reason above is older than the rule.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Otherwise checkout leaves the job's token in `.git/config`, where
          # every `build.rs` in the dependency graph and every install script
          # can read it. Here it is read-only and there is no build, but every
          # job in this file does the same so that the one that matters cannot
          # be the one that forgot.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Before anything is compiled: an installer that reports a different
      # version than the tag it came from is a support problem forever, and a
      # missing release note would only be noticed after the builds.
      - name: Check the version and the release notes
        id: check
        env:
          # Through the environment rather than ${{ }} inside the script: a tag
          # name is arbitrary text and has no business being pasted into source.
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';

          const fail = (message) => {
            console.log(`::error::${message}`);
            process.exit(1);
          };
          const tagged = process.env.REF.startsWith('refs/tags/v');

          // Both apps, because the setup is what says a version out loud — in
          // its window, in "Installed apps" and in the name its update is
          // signed under. `pnpm build:setup` refuses to build them apart;
          // this is the same check at minute zero instead of minute three.
          const versions = {};
          for (const app of ['desktop', 'setup']) {
            const file = `apps/${app}/src-tauri/tauri.conf.json`;
            if (!existsSync(file)) fail(`${file} is missing, and the release is built from it.`);
            versions[app] = JSON.parse(readFileSync(file, 'utf8')).version;
          }
          if (versions.desktop !== versions.setup) {
            fail(`The editor says ${versions.desktop}, the setup ${versions.setup}.`);
          }
          const version = tagged ? process.env.REF_NAME.replace(/^v/, '') : versions.desktop;
          if (version !== versions.desktop) {
            fail(`Tag ${process.env.REF_NAME} means version ${version}, but tauri.conf.json says ${versions.desktop}. Fix one of them and tag again.`);
          }

          // Only a tag publishes, so only a tag needs its notes; a trial run
          // from a branch may well come before they are written.
          const notes = `release-notes/${version}.json`;
          if (tagged) {
            if (!existsSync(notes)) fail(`${notes} is missing. See release-notes/README.md.`);
            const english = JSON.parse(readFileSync(notes, 'utf8')).en;
            if (typeof english !== 'string' || !english.trim()) {
              fail(`${notes} has no 'en' text, and that is what the release page shows.`);
            }
          }

          // A version with a suffix — v0.1.0-beta.1 — is not the finished thing.
          const prerelease = version.includes('-');
          appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${prerelease}\nversion=${version}\n`);
          console.log(`UwUNotes ${version}, pre-release: ${prerelease}, publishing: ${tagged}`);
          EOF

  windows:
    needs: check
    strategy:
      matrix:
        include:
          - runner: windows-latest
            name: x64
            # IMAGE_FILE_MACHINE_AMD64 in the setup's PE header.
            machine: '0x8664'
          # GitHub's ARM64 Windows runner builds natively: Node, pnpm, the
          # Tauri CLI and Rust all come in their ARM64 flavour there, and the
          # setup and the editor inside it are ARM64 executables.
          - runner: windows-11-arm
            name: arm64
            # IMAGE_FILE_MACHINE_ARM64.
            machine: '0xAA64'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # No `cache: pnpm`. A cache is written by one run and read by the next,
      # including runs on branches, so a restored store is an input nobody
      # reviewed. The release builds take the extra minute and install from the
      # lockfile every time.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # `tauri build` runs this again through beforeBuildCommand. Doing it here
      # anyway means a TypeScript error fails as its own step after a minute,
      # rather than somewhere inside the bundler's output.
      - run: pnpm build

      # `stable` is a branch of that repository, not a tag, so the pin is a
      # commit and the toolchain is named here instead of being read off the
      # branch the pin no longer follows.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # UwUNotes-Setup-<version>.exe (x64) or …-windows-arm64.exe in
      # target/release: the editor built with --no-bundle and packed into
      # UwUNotes' own installer, which is the file people download and the file
      # an installed copy runs to update itself. The Cargo workspace is the
      # repository root, so that is the root's target, not one next to
      # src-tauri. Unsigned: see `sign`.
      - name: Build the setup
        run: pnpm build:setup

      # An x64 setup published as the ARM64 one would install, run under
      # emulation, and follow the x64 feed entry from then on — nothing would
      # fail, which is why it is looked at here.
      - name: Check the setup is built for ${{ matrix.name }}
        shell: pwsh
        env:
          MACHINE: ${{ matrix.machine }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $names = "UwUNotes-Setup-$env:VERSION.exe", "UwUNotes-Setup-$env:VERSION-windows-arm64.exe"
          $setup = @(Get-ChildItem target/release/UwUNotes-Setup-*.exe | Where-Object Name -in $names)
          if ($setup.Count -ne 1) { throw "Expected one setup, found $($setup.Count)." }
          $bytes = [IO.File]::ReadAllBytes($setup[0].FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = '0x{0:X4}' -f [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne $env:MACHINE) { throw "$($setup[0].Name) is for machine $machine, not $env:MACHINE." }
          "$($setup[0].Name): machine $machine"

      - name: Collect what the release attaches
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/UwUNotes-Setup-*.exe dist/
          Get-ChildItem dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: setup-windows-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  macos:
    needs: check
    # One image for both kinds of Mac, built on the Apple Silicon runner: the
    # Intel half is a cross-compile, which Apple's toolchain does natively and
    # which queues far sooner than an Intel runner does.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # UwUNotes-Setup-<version>-macos-universal.dmg: the editor as a universal
      # app bundle, packed into the setup's own universal app bundle, in a disk
      # image. The script checks with `lipo` that both halves are in both.
      # Unsigned for the updater here: see `sign`.
      - name: Build the setup
        run: pnpm build:setup

      - name: Collect what the release attaches
        run: |
          mkdir -p dist
          cp target/release/UwUNotes-Setup-*-macos-universal.dmg dist/
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: setup-macos
          path: dist/*
          if-no-files-found: error

  linux:
    needs: check
    strategy:
      matrix:
        include:
          # 22.04 rather than latest: a binary links against the glibc it was
          # built with and runs on that one and newer, so the older the build
          # machine, the more distributions the download works on.
          - runner: ubuntu-22.04
            name: x64
            rust: x86_64
          # The same Ubuntu on GitHub's ARM runner, natively: WebKitGTK does
          # not cross-compile gracefully, and nothing here needs it to.
          - runner: ubuntu-22.04-arm
            name: arm64
            rust: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # What Tauri needs to compile against on Linux: WebKitGTK 4.1 and the
      # GTK stack underneath it. The same library is what the editor needs at
      # run time, which the .deb and .rpm declare and docs/install.md tells
      # people. `rpm` is only for looking into the finished .rpm below.
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev rpm xdg-utils

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # UwUNotes-Setup-<version>-linux-x86_64.tar.gz: one executable inside,
      # the setup with the editor packed into it. No longer a download: it is
      # what the copies the setup installed in 0.4.x update from, published as
      # UwUNotes-update-linux-x64.tar.gz. x64 only, because nothing older runs
      # on arm64. Before the packages, which rename the editor's executable.
      # Unsigned here: see `sign`.
      - name: Build the setup the 0.4.x copies update from
        if: matrix.name == 'x64'
        run: pnpm build:setup

      # UwUNotes-<version>-linux-<arch>.deb and .rpm, and
      # UwUNotes-linux-<arch>-portable.tar.gz. Unsigned here: see `sign`.
      - name: Build the .deb, the .rpm and the portable folder
        run: node scripts/build-linux-packages.mjs

      # Cheap checks of what people will install, on the oldest system it is
      # for: the .deb installs with its dependencies, dpkg's list names the
      # executable the editor looks for when it decides whether it may update
      # itself, the executable knows it came in a .deb, and every library it
      # links is there. The .rpm is looked at rather than installed — there is
      # no rpm-based system on this runner — and the portable folder is opened.
      - name: Check the packages
        env:
          VERSION: ${{ needs.check.outputs.version }}
          ARCH: ${{ matrix.rust }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          deb="target/release/UwUNotes-${VERSION}-linux-${ARCH}.deb"
          rpm="target/release/UwUNotes-${VERSION}-linux-${ARCH}.rpm"
          portable="target/release/UwUNotes-linux-${NAME}-portable.tar.gz"

          sudo apt-get install -y "./$deb"
          grep -qx /usr/bin/uwunotes /var/lib/dpkg/info/uwunotes.list
          grep -q __TAURI_BUNDLE_TYPE_VAR_DEB /usr/bin/uwunotes
          grep -qx Name=UwUNotes /usr/share/applications/uwunotes.desktop
          if ldd /usr/bin/uwunotes | grep 'not found'; then exit 1; fi
          sudo apt-get remove -y uwunotes

          test "$(rpm -qp --queryformat '%{NAME} %{ARCH}' "$rpm")" = "uwunotes $ARCH"

          listing=$(tar -tzf "$portable")
          for file in UwUNotes/AppRun UwUNotes/uwunotes UwUNotes/README.txt UwUNotes/usr/bin/uwunotes; do
            grep -qx "$file" <<< "$listing" || { echo "::error::$portable has no $file"; exit 1; }
          done
          echo "The .deb installs, the .rpm is uwunotes $ARCH, the portable folder is complete."

      - name: Collect what the release attaches
        run: |
          mkdir -p dist
          cp target/release/UwUNotes-*-linux-*.deb target/release/UwUNotes-*-linux-*.rpm target/release/UwUNotes-linux-*-portable.tar.gz dist/
          if [ -e target/release/UwUNotes-Setup-*-linux-x86_64.tar.gz ]; then
            cp target/release/UwUNotes-Setup-*-linux-x86_64.tar.gz dist/
          fi
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: setup-linux-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  sign:
    needs: [check, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      # The lockfile, which says which version of Tauri's CLI the builds used
      # and so which one signs, and scripts/release-files.mjs, which says what
      # is signed under which name — a Node script without dependencies. No
      # workspace, so no package.json whose scripts could run, and no
      # node_modules.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            pnpm-lock.yaml
            scripts/release-files.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Into a folder of its own, with install scripts off. The CLI needs none:
      # its native half is an optional dependency, which npm installs either
      # way, and which the CLI's own package pins to its exact version.
      - name: Install the signer
        run: |
          version=$(grep -m1 -oE "^  '@tauri-apps/cli@[0-9]+\.[0-9]+\.[0-9]+'" pnpm-lock.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$version" ]; then
            echo "::error::pnpm-lock.yaml names no @tauri-apps/cli version."
            exit 1
          fi
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/signer" "@tauri-apps/cli@$version"
          "$RUNNER_TEMP/signer/node_modules/.bin/tauri" --version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: setup-*
          path: dist
          merge-multiple: true

      # Every file an installed copy may download, under the versioned name
      # that copy expects in the signature: a copy of the Mac image under each
      # of the two names Macs look for, the others as they were built. The
      # script fails if a build is missing, and prints what to sign.
      - name: Put the files under the names they are signed as
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: node scripts/release-files.mjs stage "$VERSION" --dir dist > "$RUNNER_TEMP/to-sign.txt"

      # The one step that ever holds the key. It arrives through `env:` and is
      # never named in a `run:` line — a secret interpolated into a command is a
      # secret in the log of the first job that fails in an interesting way.
      #
      # What is signed is what an installed copy downloads through the feed:
      # the Windows setups, which it runs, the .deb and .rpm, which the package
      # manager installs, and the Linux archives and the Mac image, which it
      # only announces. The x64 portable folder is not in the feed.
      - name: Sign for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          while IFS= read -r file; do
            "$RUNNER_TEMP/signer/node_modules/.bin/tauri" signer sign "$file"
          done < "$RUNNER_TEMP/to-sign.txt"

      # A release without a signature is a release nobody can update to, and an
      # unset secret looks from here exactly like a signer that simply did not
      # sign: a folder with no .sig in it.
      - name: Check every file was signed
        run: |
          count=0
          while IFS= read -r file; do
            if [ ! -s "$file.sig" ]; then
              echo "::error::$file has no signature. Check the TAURI_SIGNING_PRIVATE_KEY secrets."
              exit 1
            fi
            echo "Signed: $file"
            count=$((count + 1))
          done < "$RUNNER_TEMP/to-sign.txt"
          if [ "$count" -ne 10 ]; then
            echo "::error::Expected ten files to sign, found $count."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signatures
          path: dist/*.sig
          if-no-files-found: error

  publish:
    needs: [check, sign]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and pushing the feed are the only things in this
      # workflow that write anything.
      contents: write
    steps:
      # For the scripts and the release notes. Nothing is installed and nothing
      # is built: the scripts use Node's own modules only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The builds and their signatures from `sign`, side by side in one folder.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      # dist/ gets the same copies under the signed names `sign` made, which
      # is the shape update-feed.mjs checks the signatures in; release/ gets
      # the files under the names the release page shows, and nothing else;
      # and the body is the notes with the Downloads section under them.
      - name: Lay out the release
        id: layout
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          node scripts/release-files.mjs stage "$VERSION" --dir dist > /dev/null
          node scripts/release-files.mjs publish "$VERSION" --dir dist --out release
          body="$RUNNER_TEMP/release-body.md"
          # As a file, so newlines and umlauts survive the trip into the action.
          node scripts/release-files.mjs notes "$VERSION" --out "$body"
          echo "body=$body" >> "$GITHUB_OUTPUT"

      # The signature above is for the updater. Windows and macOS still see a
      # program nobody vouched for, so for a person downloading an installer by
      # hand a checksum stays the only thing to check it against. It proves
      # nothing on its own — it is published by the same workflow — but it
      # makes a file that was swapped afterwards, on a mirror or in a forwarded
      # message, noticeable. Everything the release attaches is listed, so the
      # file matches the release page rather than a subset of it; the AUR
      # package takes its checksums from here too. sha256sum writes LF, which
      # is what `sha256sum -c` reads; v0.2.0 shipped a CRLF file that could not
      # be checked that way.
      - name: Write the checksums
        run: |
          (cd release && sha256sum -- *) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # softprops rather than `gh release create`: the body comes from a file,
      # the files are globbed, the pre-release flag is an input, and a file that
      # failed to appear fails the job.
      #
      # No .sig files any more: the feed carries every signature, and a .sig
      # next to a stable-named file would name a different, versioned file in
      # its trusted comment, which is more confusing than useful by hand.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ steps.layout.outputs.body }}
          prerelease: ${{ needs.check.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            release/*
            SHA256SUMS.txt

      # Only now, with the release online and everything attached to it. The
      # feed is what every installed copy asks; one that names a file which is
      # not there yet is not a delay, it is a failed update on someone's
      # machine, retried until the next release.
      - name: Build the update feed
        if: needs.check.outputs.prerelease == 'false'
        env:
          TAG: ${{ github.ref_name }}
          # The repository is public, so this buys nothing but a rate limit of
          # this job's own: unauthenticated, the runner shares one per address.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-feed.mjs "$TAG" --dir dist --require-all --verify-release --out "$RUNNER_TEMP/latest.json"

      - name: Publish the update feed
        if: needs.check.outputs.prerelease == 'false'
        env:
          # checkout ran with persist-credentials: false, so no step in this job
          # inherited a token that can write anything — it has to be handed over
          # on purpose, and this is the step that gets one. It stays inside a
          # variable: the script below is printed to the log exactly as it is
          # written here, unexpanded.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # git declines to commit for nobody.
          GIT_AUTHOR_NAME: UwUNotes Release
          GIT_AUTHOR_EMAIL: release@uwunotes.invalid
          GIT_COMMITTER_NAME: UwUNotes Release
          GIT_COMMITTER_EMAIL: release@uwunotes.invalid
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/update-feed"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # No hooks, whatever any config on this runner says: the one git
          # command sequence in this workflow that holds a writing token runs
          # exactly the git it says and nothing a hook adds.
          git() { command git -c core.hooksPath=/dev/null "$@"; }

          # `updates` carries the feed and nothing else, so it is an orphan
          # branch: the first release starts it from an empty repository
          # instead of from main's history.
          if [ -n "$(git ls-remote --heads "$remote" updates)" ]; then
            git clone -q --depth 1 --branch updates "$remote" "$dir"
          else
            echo 'The updates branch does not exist yet; this release starts it.'
            git init -q -b updates "$dir"
            printf '%s\n' '# Update feed' '' \
              'Written by .github/workflows/release.yml at the end of every finished release.' \
              'Installed UwUNotes copies read `latest.json` from here; nothing else lives on' \
              'this branch.' > "$dir/README.md"
          fi

          cp "$RUNNER_TEMP/latest.json" "$dir/"
          git -C "$dir" add --all
          git -C "$dir" commit -qm "UwUNotes $TAG"
          git -C "$dir" push -q "$remote" HEAD:updates
          echo "Feed: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/updates/latest.json"

      # A pre-release is something people went looking for. The feed is what
      # everyone else follows, so it stays on the last finished version — and
      # says so, because a skipped step with no reason is a thing to look up.
      - name: Say why a pre-release gets no feed
        if: needs.check.outputs.prerelease == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: echo "::notice::$TAG is a pre-release, so latest.json keeps pointing at the last finished version."

  aur:
    needs: [check, publish]
    runs-on: ubuntu-latest
    # Read-only, and no secret but the AUR's own key: this job writes to the
    # AUR and to nothing on GitHub. Pre-releases go there too — someone who
    # installs uwunotes-bin gets what the release page offers.
    permissions:
      contents: read
    steps:
      # For scripts/aur.mjs and the PKGBUILD template, Node's own modules only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # From the published release rather than from an artifact: the package
      # has to match what the AUR helper will download, and that is the file on
      # the release page.
      - name: Write PKGBUILD and .SRCINFO
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/SHA256SUMS.txt" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/SHA256SUMS.txt"
          node scripts/aur.mjs "$VERSION" --sums "$RUNNER_TEMP/SHA256SUMS.txt" --out "$RUNNER_TEMP/aur"
          cat "$RUNNER_TEMP/aur/PKGBUILD"

      # Until the AUR account and its key exist, this is a notice and not a
      # failure: the release is out either way, and the files above are in the
      # log for anyone who wants to push them by hand.
      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.check.outputs.version }}
          GIT_AUTHOR_NAME: UwUNotes Release
          GIT_AUTHOR_EMAIL: release@uwunotes.invalid
          GIT_COMMITTER_NAME: UwUNotes Release
          GIT_COMMITTER_EMAIL: release@uwunotes.invalid
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "::notice::No AUR_SSH_PRIVATE_KEY secret, so uwunotes-bin was not pushed to the AUR."
            exit 0
          fi
          ssh="$RUNNER_TEMP/ssh"
          mkdir -m 700 "$ssh"
          (umask 077 && printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh/aur")
          # The AUR's Ed25519 host key, pinned rather than scanned: its
          # fingerprint SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4 is
          # the one aur.archlinux.org publishes on its front page.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh/known_hosts -o StrictHostKeyChecking=yes"
          git() { command git -c core.hooksPath=/dev/null -c init.defaultBranch=master "$@"; }

          dir="$RUNNER_TEMP/uwunotes-bin"
          git clone -q ssh://aur@aur.archlinux.org/uwunotes-bin.git "$dir"
          cp "$RUNNER_TEMP/aur/PKGBUILD" "$RUNNER_TEMP/aur/.SRCINFO" "$dir/"
          git -C "$dir" add PKGBUILD .SRCINFO
          if git -C "$dir" diff --cached --quiet; then
            echo "uwunotes-bin already says $VERSION."
          else
            git -C "$dir" commit -qm "UwUNotes $VERSION"
            git -C "$dir" push -q origin HEAD:master
            echo "Pushed uwunotes-bin $VERSION: https://aur.archlinux.org/packages/uwunotes-bin"
          fi
          rm -rf "$ssh"
