name: CI

# The front end once, on Linux; rustfmt, clippy and the Rust tests for the
# whole workspace on Linux and on Windows; the setup's macOS half on a Mac.
# Four jobs side by side, none waiting for another. The editor's macOS build is
# checked by mas.yml on the pull requests that touch it, and by every release.

on:
  push:
    branches: [main]
    # Text only: nothing in it is compiled or tested. Prettier also looks at
    # Markdown and the release notes, and a release pull request always
    # carries code beside them.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'release-notes/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'release-notes/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the older run's answer worthless, and both would be sitting
# in the same runner queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Corepack fetches the pnpm version from package.json the first time it is
  # asked for one, and would rather confirm that first. There is nobody here to
  # confirm it.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  CARGO_TERM_COLOR: always
  # Nothing here builds the same tree twice; incremental state is only
  # cache weight.
  CARGO_INCREMENTAL: '0'

jobs:
  web:
    name: Front end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every `uses:` in these workflows is pinned to a commit rather than to a
      # tag or a branch, with the version in the comment. A tag can be moved
      # and `@stable` is a branch, so an unpinned action is whatever that
      # repository's owner — or whoever takes their account — says it is on the
      # day the job runs. Dependabot keeps these current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The token here is read-only, so this buys nothing today. It is the
          # house style so that the next workflow, which may not be, inherits
          # it: see the release job for what it costs to forget.
          persist-credentials: false

      # setup-node twice, on purpose: the pnpm cache asks `pnpm store path`
      # where the store is, so pnpm has to exist before caching is switched on,
      # and `corepack enable` can only put it next to a Node that is already
      # installed. The second call finds the toolchain in place and costs a
      # second.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Both pages: the editor's and the setup's.
      - run: pnpm -r build

  rust:
    name: Rust (${{ matrix.os }})
    # The whole workspace on both systems. Windows is where UwUNotes is
    # developed and the only place the tests that touch the registry or a
    # shortcut can run; Linux has the setup's Linux half and is the cheap place
    # for rustfmt.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # A hung runner fails instead of holding everything for six hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # WebKitGTK and the GTK stack Tauri compiles against on Linux.
      - name: Install the system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev

      # tauri-build refuses to compile an app whose frontendDist (../dist) is
      # missing, but a debug build embeds nothing from it: an empty page each
      # instead of Node, pnpm and two front-end builds, which `web` does.
      - name: Front-end placeholders
        shell: bash
        run: |
          for app in desktop setup; do
            mkdir -p "apps/$app/dist"
            echo '<!doctype html>' > "apps/$app/dist/index.html"
          done

      # This action has no version tags; the branch name is the toolchain — and
      # that is exactly why the pin above is a commit and `toolchain` is named
      # here rather than left to the default. The commit and the branch would
      # otherwise be able to disagree about which compiler this installs.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Pull requests read main's cache; only main writes one. A cache per
          # branch filled the repository's 10 GB and pushed main's out, so
          # every run started from nothing.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  setup-macos:
    name: Setup (macOS)
    # The setup is the one crate with code of its own for macOS — where the
    # editor goes, the app bundle — and none of it compiles anywhere else. Its
    # tests install into a temporary home folder for real.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # tauri-build wants the setup's page; see the placeholders above.
      - name: Front-end placeholder
        run: |
          mkdir -p apps/setup/dist
          echo '<!doctype html>' > apps/setup/dist/index.html

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy -p uwunotes-setup --all-targets --locked -- -D warnings
      - run: cargo test -p uwunotes-setup --locked --no-fail-fast
