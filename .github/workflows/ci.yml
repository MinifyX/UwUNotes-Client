name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes the older run's answer worthless, and both would be sitting
# in the same runner queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Corepack fetches the pnpm version from package.json the first time it is
  # asked for one, and would rather confirm that first. There is nobody here to
  # confirm it.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` in both workflows is pinned to a commit rather than to a
      # tag or a branch, with the version in the comment. A tag can be moved
      # and `@stable` is a branch, so an unpinned action is whatever that
      # repository's owner — or whoever takes their account — says it is on the
      # day the job runs. Dependabot keeps these current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The token here is read-only, so this buys nothing today. It is the
          # house style so that the next workflow, which may not be, inherits
          # it: see the release job for what it costs to forget.
          persist-credentials: false

      # setup-node twice, on purpose: the pnpm cache asks `pnpm store path`
      # where the store is, so pnpm has to exist before caching is switched on,
      # and `corepack enable` can only put it next to a Node that is already
      # installed. The second call finds the toolchain in place and costs a
      # second.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  rust:
    # The whole workspace, on Windows: that is where it is developed, and where
    # every test that touches the registry or a shortcut can run at all. The
    # setup's macOS and Linux halves get the job below.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tauri-build refuses to compile the desktop crate while frontendDist
      # (../dist) is missing, so even `cargo test` needs the frontend built.
      - run: pnpm build

      # This action has no version tags; the branch name is the toolchain — and
      # that is exactly why the pin above is a commit and `toolchain` is named
      # here rather than left to the default. The commit and the branch would
      # otherwise be able to disagree about which compiler this installs.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  setup-unix:
    # The setup is the one crate with code of its own for macOS and Linux —
    # where the editor goes, the desktop entry, the app bundle — and none of it
    # compiles on the Windows job above. So it is linted and tested here, on the
    # systems it is for; its tests install into a temporary home folder for
    # real. Just the setup: the editor is the same code everywhere and is built
    # on both systems by every release.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # WebKitGTK and the GTK stack Tauri compiles against on Linux. macOS
      # has everything it needs.
      - name: Install the system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tauri-build wants the setup's page built before the crate compiles.
      - run: pnpm --filter @uwunotes/setup build

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo clippy -p uwunotes-setup --all-targets -- -D warnings
      - run: cargo test -p uwunotes-setup
